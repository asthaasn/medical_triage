<html>
    <title>implicit conversion</title>
    <body>
        <script>
            let a = 10;
            let b = 5;
            document.write("<h3>Arithmetic Operators</h3>");
            document.write("a + b = " + (a + b) + "<br>");
            document.write("a - b = " + (a - b) + "<br>");
            document.write("a * b = " + (a * b) + "<br>");
            document.write("a / b = " + (a / b) + "<br>");
            document.write("a % b = " + (a % b) + "<br>");
            document.write("a * b = " + (a * b) + "<br>");

            // 2. Assignment Operators
    document.write("<h3>Assignment Operators</h3>");
    let x = 10;
    x += 5;
    document.write("x += 5 : " + x + "<br>");
    x -= 3;
    document.write("x -= 3 : " + x + "<br>");
    x *= 2;
    document.write("x *= 2 : " + x + "<br>");
    x /= 4;
    document.write("x /= 4 : " + x + "<br>");
    x %= 3;
    document.write("x %= 3 : " + x + "<br>");

      // 3. Comparison Operators
    document.write("<h3>Comparison Operators</h3>");
    document.write("a == b : " + (a == b) + "<br>");
    document.write("a === b : " + (a === b) + "<br>");
    document.write("a != b : " + (a != b) + "<br>");
    document.write("a !== b : " + (a !== b) + "<br>");
    document.write("a > b : " + (a > b) + "<br>");
    document.write("a < b : " + (a < b) + "<br>");
    document.write("a >= b : " + (a >= b) + "<br>");
    document.write("a <= b : " + (a <= b) + "<br>");

    // 4. Logical Operators
    document.write("<h3>Logical Operators</h3>");
    document.write("(a > 5 && b < 10) : " + (a > 5 && b < 10) + "<br>");
    document.write("(a > 20 || b < 10) : " + (a > 20 || b < 10) + "<br>");
    document.write("!(a > b) : " + (!(a > b)) + "<br>");

    // 5. Increment and Decrement Operators
    document.write("<h3>Increment / Decrement Operators</h3>");
    let n = 5;
    document.write("n++ : " + (n++) + "<br>");
    document.write("++n : " + (++n) + "<br>");
    document.write("n-- : " + (n--) + "<br>");
    document.write("--n : " + (--n) + "<br>");
            
            </script>
    </body>
</html>
